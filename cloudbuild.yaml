# Cloud Build: ビルド → イメージ push → Cloud Run デプロイ
# main ブランチへのプッシュで自動実行（トリガー設定時）
# 手動: gcloud builds submit --config cloudbuild.yaml .
substitutions:
  _IMAGE_TAG: latest

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/my-health-apps:${_IMAGE_TAG}'
      - '--build-arg'
      - 'DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy'
      - '--build-arg'
      - 'AUTH_SECRET=dummy_secret_for_build_only'
      - '--build-arg'
      - 'GOOGLE_CLIENT_ID=dummy_client_id'
      - '--build-arg'
      - 'GOOGLE_CLIENT_SECRET=dummy_client_secret'
      - '--build-arg'
      - 'NEXTAUTH_URL=http://localhost:3000'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/my-health-apps:${_IMAGE_TAG}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'my-health-apps'
      - '--image'
      - 'gcr.io/$PROJECT_ID/my-health-apps:${_IMAGE_TAG}'
      - '--region'
      - 'asia-northeast2'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - 'my-health-app-485805:asia-northeast2:my-health-db'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
