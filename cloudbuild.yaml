# Cloud Build: ビルド → イメージ push → Cloud Run デプロイ
# main ブランチへのプッシュで自動実行（トリガー設定時）
# ビルド通過のため --build-arg でダミー値を注入（実際のDB接続はしない）
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/my-health-apps:$COMMIT_SHA'
      - '--build-arg'
      - 'DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy'
      - '--build-arg'
      - 'AUTH_SECRET=dummy_secret_for_build_only'
      - '--build-arg'
      - 'NEXTAUTH_SECRET=dummy_secret_for_build_only'
      - '--build-arg'
      - 'GOOGLE_CLIENT_ID=dummy_client_id'
      - '--build-arg'
      - 'GOOGLE_CLIENT_SECRET=dummy_client_secret'
      - '--build-arg'
      - 'NEXTAUTH_URL=http://localhost:3000'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/my-health-apps:$COMMIT_SHA'

  # Cloud Run へのデプロイ（環境変数・Cloud SQL は既存設定を継続）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'my-health-apps'
      - '--image'
      - 'gcr.io/$PROJECT_ID/my-health-apps:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast2'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - 'my-health-app-485805:asia-northeast2:my-health-db'
