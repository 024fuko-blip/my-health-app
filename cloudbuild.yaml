# Cloud Build: ビルド → イメージ push → Cloud Run デプロイ
# ビルド通過のため --build-arg でダミー値を注入（本番の値は Cloud Run の環境変数で設定）
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/my-health-app:$COMMIT_SHA'
      - '--build-arg'
      - 'DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy'
      - '--build-arg'
      - 'AUTH_SECRET=dummy_secret_for_build_only'
      - '--build-arg'
      - 'GOOGLE_CLIENT_ID=dummy'
      - '--build-arg'
      - 'GOOGLE_CLIENT_SECRET=dummy'
      - '--build-arg'
      - 'NEXTAUTH_URL=https://placeholder.run.app'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/my-health-app:$COMMIT_SHA'

  # Cloud Run へのデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'my-health-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/my-health-app:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast1'
      # 実行時の本物の変数は、コンソールで設定済みならここでの指定は不要（自動継続）
      # コマンドで更新する場合は以下を追記
      # - '--set-env-vars'
      # - 'AUTH_SECRET=本物の値,DATABASE_URL=本物のURL'
